name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        run: |
          simulator_id=$(./scripts/ci-simulator-id.sh)
          echo "Using simulator $simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ten-thousand-hours.xcodeproj \
            -scheme TenThousandHours \
            -destination "id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Select oldest simulator
        run: |
          oldest_id=$(./scripts/ci-simulator-id.sh oldest)
          if [[ "$oldest_id" == "$SIMULATOR_ID" ]]; then
            echo "::notice::Only one iOS runtime is available; skipping the oldest-runtime unit tests"
          fi
          echo "OLDEST_SIMULATOR_ID=$oldest_id" >> "$GITHUB_ENV"

      - name: Unit tests on oldest iOS runtime
        if: env.OLDEST_SIMULATOR_ID != env.SIMULATOR_ID
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ten-thousand-hours.xcodeproj \
            -scheme TenThousandHours \
            -destination "id=$OLDEST_SIMULATOR_ID" \
            -only-testing:TenThousandHoursTests \
            -resultBundlePath OldestTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            OldestTestResults.xcresult
